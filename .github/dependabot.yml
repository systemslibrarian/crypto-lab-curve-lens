# TypeScript 7 is ignored here, deliberately, since 2026-08-21.
#
# Not a code problem: `tsc --noEmit` passes clean under TS 7 in this repo. The
# blocker is typescript-eslint, which throws at module load on any TS >= 7
# (`if (versionMajor >= 7) throw`), and eslint.config.js imports it, so the lint
# config cannot be loaded at all. That check reads the resolved TypeScript
# version, so an npm `overrides` entry does not get around it.
#
# 8.67.0 is the latest release and the canary carries the same
# `typescript >=4.8.4 <6.1.0` peer range -- there is no version to move to.
# Tracking: https://github.com/typescript-eslint/typescript-eslint/issues/10940
#
# The ignore lives in Dependabot's own state (set via `@dependabot ignore this
# major version` on the PR), not in this file -- this note is here because this
# is where someone will look. When typescript-eslint ships TS 7 support, drop
# the ignore and the bump should be a one-line merge.
# Grouped so an ecosystem's routine bumps arrive as ONE pull request instead of
# one per dependency. Ungrouped, this fleet opened 1,461 PRs across 176 repos.
#
# Majors are deliberately left OUT of the npm group. When the 2026-08-18 backlog
# was landed by hand, 109 bumps had to be held back and they were overwhelmingly
# majors -- @noble/curves and @noble/hashes v2 dropped the export subpaths this
# lab's source imports, and TypeScript 7 / vitest 4 broke a smaller set. Grouping
# a breaking major together with the safe bumps makes the whole PR unmergeable,
# so majors arrive as individual pull requests.
#
# Arriving separately is not the same as being approved by a person. EVERY
# Dependabot pull request auto-merges once this lab's own gate passes, majors
# included -- the merge condition filters on AUTHOR, not on bump type. The gate
# (unit tests, build, axe WCAG, e2e claims) is what decides, and a major that
# breaks this lab fails it and stays open for a human. vitest 4 -> 5 landed that
# way here, green, on 2026-09-10.
#
# github-actions majors ARE grouped: checkout v4->v7, setup-node v4->v7 and the
# Pages v5/v6 jumps were verified green across all 176 repos on 2026-08-18.
#
# See the dependabot-auto-merge job in ci.yml -- NOT in deploy.yml, which is
# where this note used to send people.
#
# The `cooldown` blocks below DECLARE a hold that was already happening. Dependabot's
# updater passes `--min-release-age=3` to npm on its own, with nothing in this repo asking
# it to: no .npmrc, no package.json `config` key, no `cooldown` field in the job
# definition, and no org layer to inherit from (this is a personal account). The only place
# it was visible was a job log line reading "Filtered out 1 versions due to cooldown".
#
# That is how eslint 10.11.0 sat unbumped while jsdom, prettier and vitest all landed in
# one grouped PR on 2026-09-21: eslint was 2.66 days old, the other three were 3.60 to 6.14
# days old. The hold was correct and invisible, which is the worst combination -- it reads
# as Dependabot having missed something, and invites someone to bump it by hand and walk
# straight through the quarantine window the hold exists to enforce.
#
# Cooldown applies to VERSION updates only, not security updates, so this does not delay a
# CVE fix.
#
# 3 days is a transcription of the observed default for npm, not a new policy. Deliberately
# FLAT: no semver-major-days/-minor-days/-patch-days. The majors rationale above turns on
# the gate deciding rather than the version number, and a semver-tiered cooldown would put
# bump-type sensitivity back into the pipeline. It would not falsify the claim above -- that
# claim is about the merge CONDITION, and a cooldown acts earlier, before a PR exists -- but
# it would leave two adjacent rules disagreeing about whether a version number gets a vote.
#
# The github-actions value is a CHOICE, not a transcription: --min-release-age is an npm
# flag, so the traced evidence covers npm only. 3 there matches intent, and if that
# ecosystem's real default differs, this file now states which behaviour was wanted.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      npm-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - '*'
