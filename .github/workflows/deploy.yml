name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The gate, called rather than copied -- the same file the Dependabot
  # auto-merge waits on, so what merges a bump and what publishes it are
  # one definition and cannot drift apart.
  gate:
    uses: ./.github/workflows/gate.yml

  build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 24, not 20. jsdom 30 pulls undici 8, which calls
          # worker_threads.markAsUncloneable -- added in Node 22.10 and never
          # backported to 20. On 20.x the jsdom-environment test file cannot
          # start its worker at all ("[vitest-pool]: Failed to start forks
          # worker"), and vitest still reports the other files green, so the
          # gate half-ran. npm also warned EBADENGINE on jsdom, undici,
          # whatwg-url and both @asamuzakjp packages, all of which want
          # >=22.19 / >=24. Node 20 is EOL; 24 is the current LTS.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: [gate, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
